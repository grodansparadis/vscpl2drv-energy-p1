name: CMake

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux
            os: ubuntu-latest
          - name: macOS
            os: macos-latest
          - name: Windows
            os: windows-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install --yes libexpat1-dev libssl-dev

      - name: Install macOS dependencies
        if: runner.os == 'macOS'
        run: brew install expat openssl@3

      - name: Install Windows dependencies
        if: runner.os == 'Windows'
        run: vcpkg install expat:x64-windows openssl:x64-windows pthreads:x64-windows

      - name: Apply macOS serial compatibility patch
        if: runner.os == 'macOS'
        run: git -C third_party/vscp apply ../../.github/patches/vscp-macos-serial.patch

      - name: Configure Linux build
        if: runner.os == 'Linux'
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

      - name: Configure macOS build
        if: runner.os == 'macOS'
        run: >-
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_PREFIX_PATH="$(brew --prefix openssl@3);$(brew --prefix expat)"

      - name: Configure Windows build
        if: runner.os == 'Windows'
        run: >-
          cmake -S . -B build -A x64
          -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake"
          -DVCPKG_TARGET_TRIPLET=x64-windows

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Package Windows
        if: runner.os == 'Windows'
        run: cpack --config build/CPackConfig.cmake -G ZIP -C Release -B build/packages

      - name: Package Linux and macOS
        if: runner.os != 'Windows'
        run: cpack --config build/CPackConfig.cmake -C Release -B build/packages

      - name: Upload packages
        uses: actions/upload-artifact@v4
        with:
          name: vscpl2drv-energy-p1-${{ runner.os }}
          path: |
            build/packages/*.deb
            build/packages/*.rpm
            build/packages/*.tar.gz
            build/packages/*.zip
            build/packages/*.dmg
            build/packages/*.exe
          if-no-files-found: error

  raspberry-pi:
    name: Raspberry Pi ${{ matrix.arch }}
    runs-on: ubuntu-latest
    container: debian:bookworm
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            triplet: aarch64-linux-gnu
            compiler: g++-aarch64-linux-gnu
          - arch: armhf
            triplet: arm-linux-gnueabihf
            compiler: g++-arm-linux-gnueabihf

    steps:
      - name: Install checkout dependencies
        run: apt-get update && apt-get install --yes ca-certificates git

      - name: Check out source
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install cross-build dependencies
        run: |
          dpkg --add-architecture ${{ matrix.arch }}
          apt-get update
          apt-get install --yes cmake make ${{ matrix.compiler }} libexpat1-dev:${{ matrix.arch }} libssl-dev:${{ matrix.arch }}

      - name: Configure
        run: >-
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_TOOLCHAIN_FILE=cmake/toolchains/linux-${{ matrix.arch }}.cmake
          -DCPACK_DEBIAN_PACKAGE_ARCHITECTURE=${{ matrix.arch }}
          -DOPENSSL_INCLUDE_DIR=/usr/include
          -DOPENSSL_SSL_LIBRARY=/usr/lib/${{ matrix.triplet }}/libssl.so
          -DOPENSSL_CRYPTO_LIBRARY=/usr/lib/${{ matrix.triplet }}/libcrypto.so
          -DEXPAT_INCLUDE_DIR=/usr/include
          -DEXPAT_LIBRARY=/usr/lib/${{ matrix.triplet }}/libexpat.so

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Package
        run: cpack --config build/CPackConfig.cmake -G DEB -C Release -B build/packages

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: vscpl2drv-energy-p1-Raspberry-Pi-${{ matrix.arch }}
          path: build/packages/*.deb
          if-no-files-found: error
