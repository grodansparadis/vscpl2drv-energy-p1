name: CMake

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux
            os: ubuntu-latest
            artifact: build/libvscpl2drv-energy-p1.so
          - name: macOS
            os: macos-latest
            artifact: build/libvscpl2drv-energy-p1.dylib
          - name: Windows
            os: windows-latest
            artifact: build/Release/vscpl2drv-energy-p1.dll

    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install --yes libexpat1-dev libssl-dev

      - name: Install macOS dependencies
        if: runner.os == 'macOS'
        run: brew install expat openssl@3

      - name: Install Windows dependencies
        if: runner.os == 'Windows'
        run: vcpkg install expat:x64-windows openssl:x64-windows pthreads:x64-windows

      - name: Configure Linux build
        if: runner.os == 'Linux'
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

      - name: Configure macOS build
        if: runner.os == 'macOS'
        run: >-
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_PREFIX_PATH="$(brew --prefix openssl@3);$(brew --prefix expat)"

      - name: Configure Windows build
        if: runner.os == 'Windows'
        run: >-
          cmake -S . -B build -A x64
          -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake"
          -DVCPKG_TARGET_TRIPLET=x64-windows

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Upload driver
        uses: actions/upload-artifact@v4
        with:
          name: vscpl2drv-energy-p1-${{ runner.os }}
          path: ${{ matrix.artifact }}
          if-no-files-found: error
