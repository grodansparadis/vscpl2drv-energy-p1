name: Build (Raspberry Pi, reusable)

# Called by build-raspberry-pi-arm64.yml and build-raspberry-pi-armhf.yml so
# that each architecture has its own workflow and status badge.

on:
  workflow_call:
    inputs:
      arch:
        description: Debian architecture (arm64 or armhf)
        required: true
        type: string
      triplet:
        description: GNU target triplet
        required: true
        type: string
      processor:
        description: CMAKE_SYSTEM_PROCESSOR value
        required: true
        type: string
      compiler_package:
        description: Debian cross-compiler package
        required: true
        type: string
      c_compiler:
        description: C cross-compiler
        required: true
        type: string
      cxx_compiler:
        description: C++ cross-compiler
        required: true
        type: string

permissions:
  contents: read
  actions: read

jobs:
  raspberry-pi:
    name: Raspberry Pi ${{ inputs.arch }}
    runs-on: ubuntu-latest
    container: debian:bookworm

    steps:
      - name: Install checkout dependencies
        run: apt-get update && apt-get install --yes ca-certificates git

      - name: Download versioned commit
        if: github.event_name == 'workflow_run'
        uses: actions/download-artifact@v4
        with:
          name: versioned-commit
          path: ${{ runner.temp }}/version
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Read versioned commit
        if: github.event_name == 'workflow_run'
        id: version
        shell: bash
        run: echo "commit=$(cat "$RUNNER_TEMP/version/commit")" >> "$GITHUB_OUTPUT"

      - name: Check out source
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.version.outputs.commit || github.sha }}

      - name: Install cross-build dependencies
        run: |
          dpkg --add-architecture ${{ inputs.arch }}
          apt-get update
          apt-get install --yes cmake make pandoc ${{ inputs.compiler_package }} libexpat1-dev:${{ inputs.arch }} libssl-dev:${{ inputs.arch }}

      - name: Configure
        run: >-
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_SYSTEM_NAME=Linux
          -DCMAKE_SYSTEM_PROCESSOR=${{ inputs.processor }}
          -DCMAKE_C_COMPILER=${{ inputs.c_compiler }}
          -DCMAKE_CXX_COMPILER=${{ inputs.cxx_compiler }}
          -DCPACK_DEBIAN_PACKAGE_ARCHITECTURE=${{ inputs.arch }}
          -DOPENSSL_INCLUDE_DIR=/usr/include
          -DOPENSSL_SSL_LIBRARY=/usr/lib/${{ inputs.triplet }}/libssl.so
          -DOPENSSL_CRYPTO_LIBRARY=/usr/lib/${{ inputs.triplet }}/libcrypto.so
          -DEXPAT_INCLUDE_DIR=/usr/include
          -DEXPAT_LIBRARY=/usr/lib/${{ inputs.triplet }}/libexpat.so

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Package
        run: cpack --config build/CPackConfig.cmake -G DEB -C Release -B build/packages

      - name: Create checksums
        shell: bash
        working-directory: build/packages
        run: |
          shopt -s nullglob
          files=(*.deb *.rpm *.tar.gz *.zip *.dmg *.exe)
          if [ ${#files[@]} -eq 0 ]; then echo "No packages to checksum" >&2; exit 1; fi
          if command -v sha256sum >/dev/null; then
            sha256sum -b "${files[@]}" > SHA256SUMS
          else
            shasum -a 256 -b "${files[@]}" > SHA256SUMS
          fi
          cat SHA256SUMS

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: vscpl2drv-energy-p1-Raspberry-Pi-${{ inputs.arch }}
          path: |
            build/packages/*.deb
            build/packages/SHA256SUMS
          if-no-files-found: error
