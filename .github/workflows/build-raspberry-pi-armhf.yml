name: Raspberry Pi armhf

on:
  push:
    branches-ignore: [main]
    tags: ['**']
  pull_request:
  workflow_dispatch:
  workflow_run:
    workflows: [Update version]
    types: [completed]
    branches: [main]

permissions:
  contents: read
  actions: read

jobs:
  build:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    uses: ./.github/workflows/reusable-build-raspberry-pi.yml
    with:
      arch: armhf
      triplet: arm-linux-gnueabihf
      processor: armv7l
      compiler_package: g++-arm-linux-gnueabihf
      c_compiler: arm-linux-gnueabihf-gcc
      cxx_compiler: arm-linux-gnueabihf-g++
