name: Raspberry Pi arm64

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    uses: ./.github/workflows/reusable-build-raspberry-pi.yml
    with:
      arch: arm64
      triplet: aarch64-linux-gnu
      processor: aarch64
      compiler_package: g++-aarch64-linux-gnu
      c_compiler: aarch64-linux-gnu-gcc
      cxx_compiler: aarch64-linux-gnu-g++
