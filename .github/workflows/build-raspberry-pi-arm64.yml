name: Raspberry Pi arm64

on:
  push:
    branches-ignore: [main]
    tags: ['**']
  pull_request:
  workflow_dispatch:
  workflow_run:
    workflows: [Update version]
    types: [completed]
    branches: [main]

permissions:
  contents: read
  actions: read

jobs:
  build:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    uses: ./.github/workflows/reusable-build-raspberry-pi.yml
    with:
      arch: arm64
      triplet: aarch64-linux-gnu
      processor: aarch64
      compiler_package: g++-aarch64-linux-gnu
      c_compiler: aarch64-linux-gnu-gcc
      cxx_compiler: aarch64-linux-gnu-g++
